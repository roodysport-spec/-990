workflows:
  android-debug-build:
    name: Proctor Android - Debug Build
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      java: 17
    scripts:
      - name: توليد ملفات Gradle Wrapper (ناقصة بالمشروع الأصلي)
        script: |
          gradle wrapper --gradle-version 8.7
          chmod +x ./gradlew
      - name: بناء نسخة Debug من التطبيق
        script: |
          ./gradlew assembleDebug --stacktrace
    artifacts:
      - app/build/outputs/apk/debug/*.apk
